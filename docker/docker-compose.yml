version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: barqflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/barqflow
      - JWT_SECRET=barqflow_production_jwt_secret_change_me_in_prod
      - BARQFLOW_ENCRYPTION_KEY=this_is_a_32_byte_production_key
      - RUST_LOG=info,barqflow=debug
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
